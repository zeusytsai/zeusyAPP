<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FF8C42" />
  <meta name="description" content="小土小紅的家庭小工具，轉盤與投票都在這裡！" />

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="小土小紅家" />

  <title>小土小紅家</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- Font Awesome 5 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />

  <!-- Bootstrap 5.3 CSS -->
  <link rel="stylesheet" href="./libs/css/bootstrap.css" />

  <!-- 自訂樣式 -->
  <link rel="stylesheet" href="./css/main.css" />
  <link rel="stylesheet" href="./css/spinner.css" />
  <link rel="stylesheet" href="./css/vote.css" />
</head>
<body>

  <!-- ===== 頂部 Header ===== -->
  <header class="app-header">
    <span class="header-emoji">🐾</span>
    <h1>小土小紅家</h1>
    <span class="header-emoji">🐶</span>
  </header>

  <!-- ===== 轉盤頁 ===== -->
  <section id="page-spinner" class="page-section">

    <div class="paw-card spinner-wrapper">
      <!-- 轉盤與指針 -->
      <div class="canvas-container">
        <div class="spinner-pointer"></div>
        <canvas id="spinner-canvas" width="300" height="300"></canvas>
        <div class="spinner-center-dot"></div>
      </div>

      <!-- 旋轉按鈕 -->
      <div class="spin-btn-wrap">
        <button id="spin-btn" class="btn-paw">
          <i class="fas fa-sync-alt"></i>&nbsp; 旋轉！
        </button>
      </div>
    </div>

    <!-- 選項管理 -->
    <div class="paw-card spinner-items-section">
      <div class="page-title">
        <span>🎯</span> 轉盤選項
      </div>

      <!-- 新增輸入 -->
      <div class="spinner-add-row">
        <input
          type="text"
          id="new-item-input"
          placeholder="輸入新選項，按 Enter 或點 ＋"
          maxlength="20"
        />
        <button id="add-item-btn" class="btn-paw" style="padding:8px 16px;border-radius:50px;">
          <i class="fas fa-plus"></i>
        </button>
      </div>

      <!-- 選項清單 -->
      <ul id="spinner-items-list"></ul>
      <p id="items-count-hint" class="items-count-hint"></p>
    </div>

  </section>

  <!-- ===== 投票頁 ===== -->
  <section id="page-vote" class="page-section">

    <!-- 工具列 -->
    <div class="vote-toolbar">
      <div class="page-title" style="margin-bottom:0;">
        <span>🗳️</span> 家庭投票
      </div>
      <button class="btn-paw" data-bs-toggle="modal" data-bs-target="#new-vote-modal" style="padding:8px 18px;font-size:0.9rem;">
        ＋ 新增投票
      </button>
    </div>

    <!-- 進行中投票列表 -->
    <div id="vote-open-list"></div>

    <!-- 已結束投票 -->
    <div id="closed-section" style="display:none;">
      <div class="vote-section-title">已結束</div>
      <div id="vote-closed-list"></div>
    </div>

  </section>

  <!-- ===== 底部導覽列 ===== -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-page="spinner">
      <span class="nav-icon">🎡</span>
      <span>轉盤</span>
    </button>
    <button class="nav-item" data-page="vote">
      <span class="nav-icon">🗳️</span>
      <span>投票</span>
    </button>
  </nav>

  <!-- ===== 轉盤結果 Modal ===== -->
  <div class="modal fade" id="result-modal" tabindex="-1" aria-labelledby="result-modal-label" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="result-modal-label">🎉 結果出爐！</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
        </div>
        <div class="modal-body" style="padding: 32px 24px;">
          <span class="result-emoji">🎊</span>
          <p class="result-text" id="result-winner-text"></p>
          <p class="result-subtitle">就決定是你了！</p>
        </div>
        <div class="modal-footer" style="justify-content:center; border:none; padding-bottom:24px;">
          <button type="button" class="btn-paw" data-bs-dismiss="modal">
            好的！
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 新增投票 Modal ===== -->
  <div class="modal fade" id="new-vote-modal" tabindex="-1" aria-labelledby="new-vote-modal-label" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="new-vote-modal-label">🗳️ 新增投票</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
        </div>
        <div class="modal-body" style="padding: 20px 24px;">
          <!-- 投票標題 -->
          <div style="margin-bottom:16px;">
            <label style="font-weight:600;font-size:0.9rem;margin-bottom:6px;display:block;">投票問題</label>
            <input type="text" id="new-vote-title" class="form-control" placeholder="例如：這週末去哪裡玩？" maxlength="40" />
          </div>
          <!-- 選項列表 -->
          <div style="margin-bottom:10px;">
            <label style="font-weight:600;font-size:0.9rem;margin-bottom:8px;display:block;">投票選項（2~6 個）</label>
            <div id="new-vote-options">
              <div class="option-input-row">
                <input type="text" placeholder="選項 1" maxlength="30" />
                <button class="btn-remove-option" title="刪除">✕</button>
              </div>
              <div class="option-input-row">
                <input type="text" placeholder="選項 2" maxlength="30" />
                <button class="btn-remove-option" title="刪除">✕</button>
              </div>
            </div>
            <button id="add-option-btn" class="btn-paw-outline" style="margin-top:6px;">
              ＋ 新增選項
            </button>
          </div>
        </div>
        <div class="modal-footer" style="border:none; padding: 0 24px 20px; gap:8px;">
          <button type="button" class="btn-paw-outline" data-bs-dismiss="modal">取消</button>
          <button type="button" id="submit-vote-btn" class="btn-paw">發起投票</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== Scripts ===== -->
  <!-- jQuery -->
  <script src="./libs/js/jquery.min.js"></script>
  <!-- Bootstrap 5.3 -->
  <script src="./libs/js/bootstrap.js"></script>
  <!-- Firebase SDK (Compat 版，支援 firebase.database() 語法) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <!-- Firebase 設定與初始化 -->
  <script src="./js/firebase-config.js"></script>
  <!-- 轉盤邏輯 -->
  <script src="./js/spinner.js"></script>
  <!-- 投票邏輯 -->
  <script src="./js/vote.js"></script>
  <!-- APP 主控（頁面切換、SW 註冊） -->
  <script src="./js/app.js"></script>

</body>
</html>
